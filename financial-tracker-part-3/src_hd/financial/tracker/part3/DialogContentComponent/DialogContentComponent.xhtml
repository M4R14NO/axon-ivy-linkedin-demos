<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:cc="http://xmlns.jcp.org/jsf/composite" xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="http://primefaces.org/ui" xmlns:pe="http://primefaces.org/ui/extensions">
<cc:interface componentType="IvyComponent">
  <cc:attribute name="title" shortDescription="Optional title" displayName="Title" />
</cc:interface>

<cc:implementation>

  <!-- Use this component via <ic:...DialogContentComponent>, not via ui:include. -->
  <h:panelGroup layout="block" styleClass="i-flex i-gap i-flex-col">
    <h:outputText rendered="#{not empty cc.attrs.title}" value="#{cc.attrs.title}" styleClass="i-text-bold" />
    <cc:insertChildren />
  </h:panelGroup>

</cc:implementation>

</html>
