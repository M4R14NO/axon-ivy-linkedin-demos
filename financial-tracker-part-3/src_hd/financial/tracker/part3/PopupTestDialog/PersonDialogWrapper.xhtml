<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions" template="/ivy-form/layouts/form.xhtml">
  <ui:define name="title">CalledPopupView</ui:define>
  <ui:define name="content">
    <h:body class="body-hd #{ivyFreyaTheme.mode}">
      <h:form id="form">
        <h:panelGroup layout="block" styleClass="i-flex i-gap i-flex-col">
          <ic:financial.tracker.part3.PersonComponent id="personComponent" startMethod="start"
            person="#{dialogObjectBean.value}" />
          <h:panelGroup layout="block" styleClass="i-flex i-gap i-justify-end ">
            <p:commandButton value="Cancel" styleClass="ui-button-secondary ui-button-flat"
              actionListener="#{dialogResultBean.cancel}" process="@this" />
            <p:commandButton value="Proceed" icon="si si-check-1" styleClass="ui-button-primary"
              actionListener="#{dialogResultBean.close(dialogObjectBean.value)}" />
          </h:panelGroup>
        </h:panelGroup>
      </h:form>
    </h:body>
  </ui:define>
</ui:composition>
