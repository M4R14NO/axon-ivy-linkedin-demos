<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<cc:interface componentType="IvyComponent">
</cc:interface>

<cc:implementation>

    <h:panelGroup layout="block" id="audioPanel">

        <h:panelGroup id="buttonGroup">
            <p:commandButton value="Aufnahme starten"
                icon="pi pi-microphone" styleClass="p-button-success"
                action="#{audioBean.startRecording}"
                oncomplete="startRecording()"
                update="buttonGroup"
                disabled="#{audioBean.recording}" />

            <p:commandButton value="Aufnahme stoppen"
                icon="pi pi-stop" styleClass="p-button-danger"
                action="#{audioBean.stopRecording}"
                oncomplete="stopRecording()"
                update="buttonGroup"
                disabled="#{!audioBean.recording}" />

            <p:commandButton value="Aufnahme speichern" icon="pi pi-save"
                action="#{audioBean.saveAudio}" 
                onclick="return prepareSubmit()"
                styleClass="p-button-primary" 
                disabled="#{!audioBean.audioReady}"
                update="buttonGroup" />
        </h:panelGroup>

        <!-- Audio-Element AUSSERHALB des Updates -->
        <audio id="audioPlayback" controls="controls"
            style="margin-top: 1rem; width: 100%;"></audio>
        <br/>

        <h:inputHidden id="audioData" value="#{audioBean.audioBase64}" />
        
        <!-- RemoteCommand für Callback aus JavaScript -->
        <p:remoteCommand name="notifyAudioReady" 
            action="#{audioBean.setAudioReady}" 
            update="buttonGroup" />

        <p:separator />

    </h:panelGroup>

    <h:outputScript library="js" name="audio-recorder.js" />

</cc:implementation>


</html>
