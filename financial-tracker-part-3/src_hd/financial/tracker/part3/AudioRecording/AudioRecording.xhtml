<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<cc:interface componentType="IvyComponent">
</cc:interface>

<cc:implementation>

	<h:panelGroup layout="block" id="audioPanel">

		<p:commandButton type="button" value="Aufnahme starten"
			icon="pi pi-microphone" styleClass="p-button-success"
			onclick="startRecording()" />

		<p:commandButton type="button" value="Aufnahme stoppen"
			icon="pi pi-stop" styleClass="p-button-danger"
			onclick="stopRecording()" />


		<audio id="audioPlayback" controls="controls"
			style="margin-top: 1rem; width: 100%;"></audio>

		<!-- Base64 audio data -->
		<h:inputHidden id="audioData" value="#{audioBean.audioBase64}" />

		<p:separator />

		<p:commandButton value="Speichern" icon="pi pi-save"
			action="#{audioBean.saveAudio}" onclick="return prepareSubmit()"
			styleClass="p-button-primary" />

	</h:panelGroup>


</cc:implementation>


</html>
